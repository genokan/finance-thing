name: CI

# Validation only — nothing is published from CI. Images reach GHCR solely
# via the Release workflow (release.yml): on merges to main (latest,
# main-<sha>) and on published releases (semver tags).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch/PR cancels its stale in-flight run — keeps
# Dependabot rebase storms from stacking up image builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Full-history secret scan. Config in .gitleaks.toml (repo root).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:latest
          git /repo --redact --exit-code 1

  check:
    runs-on: ubuntu-latest
    env:
      # prisma generate loads prisma.config.ts, which resolves DATABASE_URL;
      # no connection is made — any well-formed value satisfies it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run typecheck
      - run: npm run test:coverage --workspaces --if-present
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            server/coverage
            client/coverage
          if-no-files-found: ignore
          retention-days: 14

  # Prove the image builds and passes the vulnerability gate — never pushed.
  # PRs only: on main pushes the Release workflow builds (and publishes dev
  # tags) anyway, so building here too would just double the work.
  image:
    if: github.event_name == 'pull_request'
    needs: [secrets, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build for scan (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: finance-thing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-thing:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Trivy does not auto-detect .trivyignore.yaml — it must be named.
          trivyignores: .trivyignore.yaml

      # Scoped to what the gate acts on. Uploading every severity including
      # unfixed base-image CVEs put 300+ alerts in the Security tab and buried
      # the CodeQL findings, which is the only thing there we can act on.
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-thing:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
        env:
          # Reuse the vuln DB pulled by the gate step — avoids a re-download.
          TRIVY_SKIP_DB_UPDATE: 'true'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
